name: API CI

on:
  push:
    branches: [ "main" ]
    paths:
      - 'API/**'
      - '.github/workflows/api-ci.yml'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'API/**'
      - '.github/workflows/api-ci.yml'
  workflow_dispatch:
    inputs:
      env:
        description: 'Environment to run tests against'
        required: true
        default: 'qa'
        type: choice
        options:
          - dev
          - qa

permissions:
  contents: write # Necesar pentru ca Github Actions sa poata scrie pe branch-ul gh-pages

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./API
    
    env:
      BASE_URL: "https://api.mapbox.com"
      LOG_LEVEL: "debug"
      TIMEOUT: "30"
      ENV_NAME: ${{ github.event.inputs.env || 'qa' }}
      API_KEY: ${{ secrets.MAPBOX_API_KEY }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven
          
      - name: Run API Tests
        run: mvn clean test -Denv=${{ env.ENV_NAME }}
        
      - name: Generate Allure Report
        if: always()
        run: mvn allure:report
        
      - name: Upload Test Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-test-results
          path: |
            API/target/allure-results/
            API/target/site/allure-maven-plugin/
            API/target/test-status/
          retention-days: 7

      - name: Publish to GitHub Pages
        if: always()
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: API/target/site/allure-maven-plugin
          destination_dir: api-report
          keep_files: true # Tine si celelalte rapoarte (UI/Perf) daca se uploadeaza ulterior

      - name: Send Slack Notification (Mock)
        if: always()
        run: echo "Mocking Slack Notification... Status is ${{ job.status }}"
