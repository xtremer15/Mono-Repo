name: Perf CI

on:
  push:
    branches: [ "main" ]
    paths:
      - 'Perf/**'
      - '.github/workflows/perf-ci.yml'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'Perf/**'
      - '.github/workflows/perf-ci.yml'
  workflow_dispatch:
    inputs:
      env:
        description: 'Environment to run tests against'
        required: true
        default: 'qa'
        type: choice
        options:
          - dev
          - qa
      workload:
        description: 'Workload type'
        required: true
        default: 'load'
        type: choice
        options:
          - smoke
          - load
          - stress

permissions:
  contents: write # Necesar pentru a putea da push pe gh-pages

jobs:
  load-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./Perf
        
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        
      - name: Install Node and Build
        run: |
          npm ci
          npm run build
          
      - name: Run k6 load test
        uses: grafana/k6-action@v0.3.1
        with:
          filename: Perf/dist/homepage.spec.bundle.js
          flags: -e TARGET_ENV=${{ github.event.inputs.env || 'qa' }} -e WORKLOAD=${{ github.event.inputs.workload || 'load' }}

      - name: Upload k6 html report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perf-html-report
          path: Perf/html-report.html
          retention-days: 7

      - name: Prepare Perf Report for GitHub Pages
        if: always()
        run: |
          mkdir -p Perf/gh-pages-report
          cp Perf/html-report.html Perf/gh-pages-report/index.html || true

      - name: Publish to GitHub Pages
        if: always()
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: Perf/gh-pages-report
          destination_dir: perf-report
          keep_files: true

      - name: Send Slack Notification (Mock)
        if: always()
        run: echo "Mocking Slack Notification... Status is ${{ job.status }}"
